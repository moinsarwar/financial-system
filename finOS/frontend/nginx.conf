server {  
    listen 80;  
    root /usr/share/nginx/html;  
    index index.html;  
    location = / {
        try_files /vanilla.html =404;
    }
    location = /dashboard/claim-vault {
        try_files /claimvault.html =404;
    }
    location / {  
        try_files $uri /index.html;  
    }  
    location /api/ai/ {
        proxy_pass http://finos-backend-1:8000/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Prefer outer HTTPS proto from host nginx/Caddy; never advertise plain http to the app
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect http:// https://;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location /api/ {  
        proxy_pass http://finos-backend-1:8000/api/;  
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        # FastAPI trailing-slash 307s used $scheme=http inside this container
        proxy_redirect http:// https://;
    }  
}
