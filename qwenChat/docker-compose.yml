services:
  backend:
    build: ./backend
    container_name: qwenchat_backend
    ports:
      - "9011:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      FINOS_API_URL: ${FINOS_API_URL:-http://host.docker.internal:8000/api}
      RESELLER_API_URL: ${RESELLER_API_URL:-http://host.docker.internal:9005/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9010,http://127.0.0.1:9010}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: qwenchat_frontend
    ports:
      - "9010:80"
    depends_on:
      - backend
    restart: unless-stopped
