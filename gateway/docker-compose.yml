# Edge gateway: route public domains to finOS + Reseller
#   thecomparisonengine.com / www / *  → finOS
#   reseller.thecomparisonengine.com   → Reseller portal

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: tce_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - finos_net
      - reseller_net
    restart: unless-stopped

networks:
  finos_net:
    external: true
    name: finos_default
  reseller_net:
    external: true
    name: reseller_default
