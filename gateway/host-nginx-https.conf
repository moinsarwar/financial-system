# Host nginx (system) — replace the static HTML site with finOS + Reseller.
# Install as: /etc/nginx/sites-available/thecomparisonengine.com
# Then: ln -sfn ... sites-enabled && nginx -t && systemctl reload nginx
#
# Production upstreams:
#   finOS frontend  → 127.0.0.1:3000  (/api is proxied inside that container)
#   Reseller UI+API → 127.0.0.1:9004  (/api proxied inside reseller frontend)
#   (optional direct API) 127.0.0.1:9005
#
# Certbot certs: /etc/letsencrypt/live/thecomparisonengine.com/

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name thecomparisonengine.com www.thecomparisonengine.com
                reseller.thecomparisonengine.com
                *.thecomparisonengine.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------------
# Reseller portal (HTTPS) → :9004
# -------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reseller.thecomparisonengine.com;

    ssl_certificate     /etc/letsencrypt/live/thecomparisonengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecomparisonengine.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# -------------------------------------------------------------------------
# finOS — apex + www + partner subdomains (HTTPS) → :3000
# -------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thecomparisonengine.com www.thecomparisonengine.com *.thecomparisonengine.com;

    ssl_certificate     /etc/letsencrypt/live/thecomparisonengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecomparisonengine.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
