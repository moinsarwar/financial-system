worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Resolve Docker DNS for upstreams that may start later
    resolver 127.0.0.11 valid=10s ipv6=off;

    # -------------------------------------------------------------------------
    # Reseller portal: reseller.thecomparisonengine.com
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name reseller.thecomparisonengine.com;

        location /api/ {
            set $reseller_api comparison_backend:8000;
            proxy_pass http://$reseller_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $reseller_fe comparison_frontend:80;
            proxy_pass http://$reseller_fe;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -------------------------------------------------------------------------
    # finOS: apex, www, and partner subdomains (*.thecomparisonengine.com)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name thecomparisonengine.com www.thecomparisonengine.com *.thecomparisonengine.com;

        # Prefer production finOS frontend (port 3000 / container). Fall back to Vite :5173 for dev.
        location /api/ {
            set $finos_api finos-backend-1:8000;
            proxy_pass http://$finos_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            # Production image published as finos-frontend / host :3000
            # Dev Vite container is finos-frontend-1:5173
            set $finos_fe finos-frontend-1:5173;
            proxy_pass http://$finos_fe;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Default catch-all (IP access)
    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            set $finos_api finos-backend-1:8000;
            proxy_pass http://$finos_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            set $finos_fe finos-frontend-1:5173;
            proxy_pass http://$finos_fe;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
