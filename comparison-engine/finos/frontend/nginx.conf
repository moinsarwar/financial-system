server {  
    listen 80;  
    root /usr/share/nginx/html;  
    index index.html;
    # Avoid stale marketing/form HTML after deploys
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files /vanilla.html =404;
    }
    location = /dashboard/claim-vault {
        try_files /claimvault.html =404;
    }
    location / {  
        try_files $uri /index.html;  
    }  
    location /api/ai/ {
        proxy_pass http://finos-backend-1:8000/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always HTTPS toward the API — Caddy terminates TLS in front of this container
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect http:// https://;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location /api/ {  
        proxy_pass http://finos-backend-1:8000/api/;  
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;  
        proxy_set_header X-Real-IP $remote_addr;  
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect http:// https://;
    }  
}
