version: '3.8'  
services:  
  db:  
    image: postgres:15-alpine  
    environment:  
      POSTGRES_USER: ${POSTGRES_USER}  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  
      POSTGRES_DB: ${POSTGRES_DB}  
    volumes:  
      - postgres_data:/var/lib/postgresql/data  
    healthcheck:  
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]  
      interval: 10s  
      timeout: 5s  
      retries: 5  
  
  backend:  
    build:  
      context: ./backend  
      target: production  
    volumes:  
      - document_uploads:/app/uploads  
    environment:  
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}  
      - SECRET_KEY=${SECRET_KEY}  
      - ENVIRONMENT=production  
      - SEED_DEMO_DATA=false  
      - CORS_ORIGINS=${CORS_ORIGINS}  
      - UPLOAD_ROOT=/app/uploads  
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - FRONTEND_URL=${FRONTEND_URL:-https://thecomparisonengine.com}
      - INVITE_TOKEN_HOURS=${INVITE_TOKEN_HOURS:-72}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@thecomparisonengine.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-The Comparison Engine}
      - SAFEPAY_ENV=${SAFEPAY_ENV:-sandbox}
      - SAFEPAY_API_BASE=${SAFEPAY_API_BASE:-https://sandbox.api.getsafepay.com}
      - SAFEPAY_API_KEY=${SAFEPAY_API_KEY:-}
      - SAFEPAY_SECRET_KEY=${SAFEPAY_SECRET_KEY:-}
      - SAFEPAY_WEBHOOK_SECRET=${SAFEPAY_WEBHOOK_SECRET:-}
      - SAFEPAY_AMOUNT_PKR=${SAFEPAY_AMOUNT_PKR:-100}
      - SAFEPAY_CURRENCY=${SAFEPAY_CURRENCY:-PKR}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:  
      - "8000"  
    healthcheck:  
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]  
      interval: 30s  
      timeout: 5s  
      retries: 3  
    depends_on:  
      db:  
        condition: service_healthy  
    networks:
      - default
      - finvault_net
  
  frontend:  
    build:  
      context: ./frontend  
      target: production  
      args:  
        VITE_API_URL: /api  
        VITE_RESELLER_API_URL: https://reseller.thecomparisonengine.com  
    ports:  
      - "3000:80"  
    depends_on:  
      - backend  
  
volumes:  
  postgres_data:
  document_uploads:

networks:
  default:
  finvault_net:
    external: true
    name: finvault_default
